    <h1>Virtual Counseling Platform</h1>

        <input type="password" id="password" placeholder="Password">

    <div id="chatbot">
        <input type="text" id="chatInput" placeholder="Ask something...">

        <p id="chatResponse"></p>
    </div>

    <!-- Chatroom -->
    <div id="chatroom">

        <div id="chatMessages"></div>
