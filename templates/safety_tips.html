<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's and Children's Safety Tips</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .navbar {
            width: 100vw;
            box-sizing: border-box;
            background: #007bff;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 14px;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .navbar .user {
            font-size: 18px;
            font-weight: bold;
        }
        .navbar .logout {
            background: white;
            color: #007bff;
            border: none;
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .navbar .logout:hover {
            background: #ddd;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 80px;
        }
        #responseBox {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f1f1f1;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="user">Welcome, {{ username }}</div>
        <a href="{{ url_for('logout') }}"><button class="logout">Logout</button></a>
    </div>

    <div class="container">
        <h2>Click for Women's and Children's Safety Tips</h2>
        <button onclick="getRandomResponse()">Get Safety Tip</button>
        <div id="responseBox">Your safety tip will appear here.</div>
    </div>

    <script>
        async function getRandomResponse() {
            try {
                const response = await fetch("{{ url_for('get_safety_tip') }}");
                const data = await response.json();
                document.getElementById("responseBox").textContent = data.response;
            } catch (error) {
                console.error("Error fetching safety tips:", error);
                document.getElementById("responseBox").textContent = "Error loading safety tip. Please try again.";
            }
        }
    </script>
</body>
</html>
