<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--=============== REMIXICONS ===============-->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="./style.css">

    <title>Forgot Password</title>
</head>
<body>
    <div class="forgot-password">
        <img src="./forgot-password-bg.png" alt="forgot password image" class="forgot-password__img">

        <form action="" class="container">
            <h1 class="forgot-password__title">Reset Password</h1>

            <div class="forgot-password__content">
                <div class="forgot-password__box">
                    <i class="ri-lock-2-line forgot-password__icon"></i>

                    <div class="forgot-password__box-input">
                        <input type="password" required class="forgot-password__input" id="forgot-pass" placeholder=" ">
                        <label for="forgot-pass" class="forgot-password__label">New Password</label>
                        <i class="ri-eye-off-line forgot-password__eye" id="forgot-eye"></i>
                    </div>
                </div>

                <div class="forgot-password__box">
                    <i class="ri-lock-2-line forgot-password__icon"></i>

                    <div class="forgot-password__box-input">
                        <input type="password" required class="forgot-password__input" id="forgot-confirm-pass" placeholder=" ">
                        <label for="forgot-confirm-pass" class="forgot-password__label">Confirm Password</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="forgot-password__button">Update Password</button>

            <p class="forgot-password__login">
                Remember your password? <a href="file:///C:/Users/Venkataramana%20K%20R/Downloads/Telegram%20Desktop/Glassmorp%20login/index.html#">Login</a>
            </p>
        </form>
    </div>
</body>
</html>
